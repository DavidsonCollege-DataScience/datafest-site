name: Render and publish to datasci-hub

# Renders the Quarto site, then publishes docs/ into the datafest/ subfolder
# of DavidsonCollege-DataScience/datasci-hub, the single repo that actually
# deploys to the datasci.davidson.edu Azure Static Web App. See that repo's
# README for the full cross-repo architecture and required secrets.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout datafest-site
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render

      - name: Checkout datasci-hub
        uses: actions/checkout@v4
        with:
          repository: DavidsonCollege-DataScience/datasci-hub
          token: ${{ secrets.HUB_REPO_PUSH_TOKEN }}
          path: hub

      - name: Sync build output into hub's /datafest
        run: |
          rsync -a --delete docs/ hub/datafest/
          cd hub
          git config user.name "datafest-site CI"
          git config user.email "actions@users.noreply.github.com"
          git add datafest
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Publish datafest-site@${GITHUB_SHA}"
            git push
          fi
